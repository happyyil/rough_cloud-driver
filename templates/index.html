<!DOCTYPE html>
<html>
<head>
    <title>文件上传系统</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; max-width: 600px; margin: 0 auto; }
        input[type="file"] { margin: 20px 0; }
        button { padding: 10px 20px; background: #007BFF; color: white; border: none; cursor: pointer; margin: 5px; }
        button:hover { background: #0056b3; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #progress { width: 100%; height: 20px; margin: 20px 0; display: none; }
        #status { margin: 20px 0; min-height: 24px; }
        .success { color: green; }
        .error { color: red; }
        .info { color: #666; }
        #fileInfo { margin: 10px 0; color: #666; }
    </style>
</head>
<body>
    <h1>文件上传</h1>
    <p>请选择文件并上传</p>
    
    <form id="uploadForm" method="post" enctype="multipart/form-data">
        <input type="file" id="fileInput" name="file" multiple required>
        <div id="fileInfo"></div>
        <br>
        <button type="submit" id="uploadBtn">立即上传</button>
    </form>
    
    <progress id="progress" max="100" value="0"></progress>
    <div id="status"></div>
    
    <p><small><a href="/teacher">查看文件</a></small></p>
    
    <script>
        const DIRECT_UPLOAD_LIMIT = 4.5 * 1024 * 1024;

        const uploadForm = document.getElementById('uploadForm');
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const progress = document.getElementById('progress');
        const status = document.getElementById('status');
        const fileInfo = document.getElementById('fileInfo');

        fileInput.addEventListener('change', () => {
            const files = fileInput.files;
            if (files.length === 0) {
                fileInfo.textContent = '';
                return;
            }
            if (files.length === 1) {
                const sizeMB = (files[0].size / 1024 / 1024).toFixed(2);
                fileInfo.textContent = `文件: ${files[0].name} (${sizeMB} MB)`;
            } else {
                const totalSize = Array.from(files).reduce((sum, f) => sum + f.size, 0);
                const totalMB = (totalSize / 1024 / 1024).toFixed(2);
                fileInfo.textContent = `已选择 ${files.length} 个文件，共 ${totalSize < 1024*1024 ? (totalSize/1024).toFixed(1)+' KB' : totalMB+' MB'}`;
            }
        });

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const files = Array.from(fileInput.files);
            if (files.length === 0) {
                showStatus('请选择文件', 'error');
                return;
            }

            uploadBtn.disabled = true;
            const smallFiles = files.filter(f => f.size <= DIRECT_UPLOAD_LIMIT);
            const largeFiles = files.filter(f => f.size > DIRECT_UPLOAD_LIMIT);

            let successCount = 0;
            let failCount = 0;
            const results = [];

            // 小文件逐个上传，避免 Vercel 4.5MB 请求体限制
            for (let i = 0; i < smallFiles.length; i++) {
                const file = smallFiles[i];
                const done = successCount + failCount;
                showStatus(`上传中... (${done}/${files.length}) - ${file.name}`, 'info');

                const formData = new FormData();
                formData.append('files', file);

                try {
                    const response = await fetch('/api/upload', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await response.json();
                    if (data.success) {
                        successCount++;
                        results.push({ name: file.name, ok: true });
                    } else {
                        failCount++;
                        results.push({ name: file.name, ok: false, error: data.error });
                    }
                } catch (err) {
                    failCount++;
                    results.push({ name: file.name, ok: false, error: err.message });
                }
            }

            // 大文件逐个走 R2 直传
            for (let i = 0; i < largeFiles.length; i++) {
                const file = largeFiles[i];
                const done = successCount + failCount;
                showStatus(`上传中... (${done}/${files.length}) - ${file.name}`, 'info');
                progress.style.display = 'block';

                try {
                    await uploadSingleToR2(file);
                    successCount++;
                    results.push({ name: file.name, ok: true });
                } catch (err) {
                    failCount++;
                    results.push({ name: file.name, ok: false, error: err.message });
                }
            }

            // 显示结果
            progress.value = 0;
            progress.style.display = 'none';

            if (failCount === 0) {
                const links = results.map(r => r.name).join(', ');
                showStatus(`全部上传成功！(${successCount} 个文件)<br><a href="/">继续上传</a>`, 'success');
            } else if (successCount === 0) {
                showStatus(`全部失败: ${results[0].error}`, 'error');
            } else {
                const failedNames = results.filter(r => !r.ok).map(r => r.name).join(', ');
                showStatus(`成功 ${successCount} 个，失败 ${failCount} 个 (${failedNames})<br><a href="/">继续上传</a>`, 'info');
            }

            uploadBtn.disabled = false;
        });

        async function uploadSingleToR2(file) {
            const presignRes = await fetch('/api/r2/presign', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    filename: file.name,
                    contentType: file.type || 'application/octet-stream'
                })
            });

            const presignData = await presignRes.json();
            if (presignData.error) throw new Error(presignData.error);

            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();

                xhr.upload.addEventListener('progress', (e) => {
                    if (e.lengthComputable) {
                        const base = (successCount || 0) / fileInput.files.length * 100;
                        const filePercent = (e.loaded / e.total) * (100 / fileInput.files.length);
                        progress.value = base + filePercent;
                    }
                });

                xhr.addEventListener('load', () => {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        resolve();
                    } else {
                        reject(new Error(`HTTP ${xhr.status}`));
                    }
                });
                xhr.addEventListener('error', () => reject(new Error('网络错误')));
                xhr.addEventListener('abort', () => reject(new Error('上传被取消')));

                xhr.open('PUT', presignData.presignedUrl);
                xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
                xhr.send(file);
            });
        }

        function showStatus(msg, type) {
            status.innerHTML = msg;
            status.className = type;
        }
    </script>
    
    <script src="/_vercel/insights/script.js" defer></script>
</body>
</html>
